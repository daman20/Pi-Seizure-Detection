[project]
name = "pi-seizure-detection"
version = "0.2.0"
description = "Pi 5 webcam streamer that feeds the companion Seizure-Processor service over MJPEG. Inference and dashboard live in that other repo."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "numpy>=1.26.4,<2",
    "opencv-python-headless>=4.11.0.86,<4.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.46.0",
]
